
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing Lab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 390px;
  background: #1e293b;
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 10px 35px #0006;
}

.logo {
  font-size: 45px;
  margin-bottom: 10px;
}

h1 {
  font-size: 25px;
}

p {
  color: #aab7ca;
  line-height: 1.7;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #475569;
  border-radius: 9px;
  background: #0f172a;
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 9px;
  background: #3b82f6;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #42252b;
  border-radius: 10px;
  color: #ffb4b4;
  line-height: 1.8;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #64748b;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🔐</div>

  <form id="demoForm">

    <input
      type="text"
      placeholder="username"
      autocomplete="off"
      required
    >

    <input
      type="password"
      placeholder="password"
      autocomplete="off"
      required
    >

    <button type="submit">
      تسجيل الدخول
    </button>

  </form>

  <div id="result">
    

    

    لم يتم حفظ أو إرسال أي بيانات.
  </div>

  <div class="footer">
    Educational Cybersecurity Lab
  </div>

</div>

<script>
document.getElementById("demoForm")
.addEventListener("submit", function(event) {

  event.preventDefault();

  document.getElementById("result").style.display = "block";

  this.reset();

});
</script>

</body>
</html>
